# config/karto_config.yaml
slam_karto:
  ros__parameters:
    # --- Frame IDs & General ROS Params ---
    map_frame: map           # Output map frame (must be a static frame)
    odom_frame: odom         # Odometry frame (must be relative to map)
    base_frame: shell_link    # Base frame of the robot (must be relative to odom)
    resolution: 0.05         # Map resolution in meters/cell
    map_update_interval: 2.0 # seconds for map publish frequency
    transform_tolerance: 2.0
    throttle_scans: 1

    # --- Karto Core Parameters (from Mapper.h) ---
    use_scan_matching: true
    use_scan_barycenter: true
    
    # Motion Thresholds (Filter scans for processing)
    minimum_travel_distance: 0.2     # meters
    minimum_travel_heading: 0.1745   # 10 degrees (0.1745 rad)
    
    # Link Match Parameters
    link_match_minimum_response_fine: 0.8
    link_scan_maximum_distance: 10.0

    # --- Loop Closure Parameters (Crucial for large maps) ---
    do_loop_closing: true
    loop_search_maximum_distance: 4.0
    loop_match_minimum_chain_size: 10
    
    # NOTE: Setters in Mapper.cpp expect the SQUARE ROOT of variance, so use this value:
    # Set LoopMatchMaximumVarianceCoarse to the desired standard deviation (e.g., 0.4m)^2 = 0.16
    loop_match_maximum_variance_coarse: 0.4  

    loop_match_minimum_response_coarse: 0.8
    loop_match_minimum_response_fine: 0.8
    
    # --- Scan Matcher Parameters ---
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03
    
    # Penalty Parameters (for odometry vs scan matching confidence)
    distance_variance_penalty: 0.3    # meters
    angle_variance_penalty: 0.349     # 20 degrees (~0.349 rad)
    minimum_distance_penalty: 0.5
    minimum_angle_penalty: 0.9
